# No secret in this file: rpc_secret comes from GARAGE_RPC_SECRET (compose).
# No [admin] section either, so the unauthenticated admin API is never bound.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"
